# prek (pre-commit-compatible git hooks) — see https://prek.j178.dev
#
#   prek install --prepare-hooks   # install hook shims + prepare environments
#   prek run --all-files           # run once across the repo
#
repos = [
  { repo = "local", hooks = [
    { id = "i18n-keys", name = "i18n keys present in en.ts & zh.ts",
      language = "system", entry = "python3 scripts/check_i18n_keys.py",
      pass_filenames = false, always_run = true },
    # Go backend gates. `go vet` and `gofmt -l` are pure checks; `go build`
    # catches compile errors. Run them over the whole module.
    { id = "gofmt", name = "gofmt (backend/go)",
      language = "system", entry = "sh -c 'test -z \"$(gofmt -l backend/)\"'",
      files = "backend/.*\\.go$", pass_filenames = false },
    { id = "go-vet", name = "go vet (backend/go)",
      language = "system", entry = "sh -c 'cd backend && go vet ./...'",
      files = "backend/.*\\.go$", pass_filenames = false },
    { id = "go-build", name = "go build (backend/go)",
      language = "system", entry = "sh -c 'cd backend && go build ./...'",
      files = "backend/.*\\.go$", pass_filenames = false },
  ] },
]
