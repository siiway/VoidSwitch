[project]
name = "voidswitch"
version = "0.1.0"
description = "Python SDK for the VoidSwitch platform API (REST + MCP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siiway" }]
keywords = ["voidswitch", "llm", "gateway", "mcp", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://voidswitch.siiway.page"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voidswitch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ty]
python-version = "3.10"