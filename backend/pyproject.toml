[project]
name = "voidswitch"
version = "0.1.0"
description = "VoidSwitch — production-grade multi-provider LLM API reverse proxy with proxy/key failover."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "httpx-socks>=0.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.10",
    "structlog>=24.4",
    "python-multipart>=0.0.31",
]

[project.scripts]
voidswitch = "voidswitch.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voidswitch"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["voidswitch", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
    "RUF", # ruff-specific
    "ASYNC",
]
ignore = [
    "B008",  # function call in default arg (FastAPI Depends idiom)
    "RUF012",  # mutable class attrs need ClassVar (SQLAlchemy/pydantic noise)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E501"]
# Embeds bash/PowerShell installer templates whose lines are naturally long.
"voidswitch/api/install.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
# httpx-socks and some libs ship without type stubs; don't fail the build on those.
unresolved-import = "warn"
