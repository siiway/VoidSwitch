# VoidSwitch Alembic configuration.
#
# The database URL is NOT stored here — it is resolved at runtime from the
# application's own settings (VOIDSWITCH_DATABASE__URL / config.yaml), so the same
# migration tree works across SQLite (dev/tests) and PostgreSQL (production).

[alembic]
# path to migration scripts, relative to the location of this ini file
script_location = %(here)s/alembic

# prepend the backend package root (parent of the alembic/ directory) to sys.path
# so env.py can import the application's models and settings.
prepend_sys_path = %(here)s

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
