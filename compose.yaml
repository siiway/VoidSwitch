# VoidSwitch — Go gateway + dashboard on one origin.
#
#   docker compose up -d          # pull images from GHCR + start (Postgres + Redis + gateway + dashboard)
#   docker compose logs -f        # follow logs
#
# To build from source instead of pulling:
#   docker compose -f compose.yaml -f compose-build.override.yaml up -d --build
#
# Configuration comes from the same VOIDSWITCH_* env vars; copy .env.example to
# .env. The dashboard (nginx) is the single front door and reverse-proxies the API
# to the `voidswitch` service (keep that service name — nginx expects it).
#
# Point your Cloudflare Tunnel / reverse proxy at the published dashboard port.
#
# Images: set VS_IMAGE to switch the registry/mirror (default ghcr.io/siiway),
# e.g. VS_IMAGE=hp.siiway.dpdns.org/ghcr.io/siiway — the gateway and dashboard
# are then pulled from <VS_IMAGE>/voidswitch and <VS_IMAGE>/voidswitch-dashboard.
# Pin a tag with VS_IMAGE_TAG (default: latest), e.g. VS_IMAGE_TAG=1.2.3.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-voidswitch}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-voidswitch}"
      POSTGRES_DB: "${POSTGRES_DB:-voidswitch}"
    volumes:
      - voidswitch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voidswitch}"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - vs-network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vs-network

  voidswitch:
    container_name: voidswitch
    image: ${VS_IMAGE:-ghcr.io/siiway}/voidswitch:${VS_IMAGE_TAG:-latest}
    # Build-from-source happens via compose-build.override.yaml (which adds a
    # `build:` block pointing at the repo root + backend/Dockerfile).
    restart: unless-stopped
    # Internal only — the dashboard service is the front door and proxies to this
    # over the compose network. Add a `ports:` mapping here only for debugging.
    expose:
      - "8080"
    environment:
      VOIDSWITCH_ENV: "${VOIDSWITCH_ENV:-production}"
      # Public URL of this gateway — used to build the OAuth redirect_uri.
      VOIDSWITCH_SERVER__BASE_URL: "${VOIDSWITCH_BASE_URL:-http://localhost:8080}"
      # Where to send the browser after OAuth login (it serves the SPA's
      # /login/callback). On a single origin this is the same as BASE_URL.
      VOIDSWITCH_SERVER__FRONTEND_URL: "${VOIDSWITCH_FRONTEND_URL:-${VOIDSWITCH_BASE_URL:-http://localhost:8080}}"
      # Stable secret so dashboard sessions + encrypted credentials survive
      # container recreation. MUST match the pre-cutover secret, or every stored
      # provider key becomes undecryptable.
      VOIDSWITCH_SERVER__SECRET_KEY: "${VOIDSWITCH_SECRET_KEY:-}"
      # Prism OAuth app credentials (required for dashboard login).
      VOIDSWITCH_PRISM__ISSUER: "${VOIDSWITCH_PRISM_ISSUER:-https://prism.siiway.org}"
      VOIDSWITCH_PRISM__CLIENT_ID: "${VOIDSWITCH_PRISM_CLIENT_ID:-}"
      VOIDSWITCH_PRISM__CLIENT_SECRET: "${VOIDSWITCH_PRISM_CLIENT_SECRET:-}"
      # PostgreSQL connection. Override VOIDSWITCH_DATABASE_URL to point at an
      # existing/managed Postgres (e.g. postgres://user:pass@db-host:5432/dbname).
      VOIDSWITCH_DATABASE__URL: "${VOIDSWITCH_DATABASE_URL:-postgres://${POSTGRES_USER:-voidswitch}:${POSTGRES_PASSWORD:-voidswitch}@postgres:5432/${POSTGRES_DB:-voidswitch}?sslmode=disable}"
      VOIDSWITCH_REDIS__URL: "${VOIDSWITCH_REDIS_URL:-redis://redis:6379/0}"
      VOIDSWITCH_REDIS__KEY_PREFIX: "${VOIDSWITCH_REDIS_KEY_PREFIX:-voidswitch}"
      # Prism team whose owners/admins are recognised as VoidSwitch staff.
      VOIDSWITCH_ADMIN__MAIN_TEAM_ID: "${VOIDSWITCH_MAIN_TEAM_ID:-63d4761c78c2dec09a002233e1b7c06c}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vs-network

  dashboard:
    image: ${VS_IMAGE:-ghcr.io/siiway}/voidswitch-dashboard:${VS_IMAGE_TAG:-latest}
    restart: unless-stopped
    # The single public origin: serves the SPA and proxies the API to voidswitch.
    # Point Cloudflare Tunnel / your reverse proxy here.
    ports:
      - "${VOIDSWITCH_PORT:-7292}:80"
    depends_on:
      voidswitch:
        condition: service_healthy
    networks:
      - vs-network

volumes:
  voidswitch-pgdata:

networks:
  # Internal network shared by the gateway + dashboard.
  vs-network:
  # Shared external network so the gateway can reach other stacks (e.g. a proxy
  # pool / sub2api service). Create it once with `docker network create ai-network`.
  # Enable it or not, depending on your need.
#   ai-network:
#     name: ai-network
#     external: true
