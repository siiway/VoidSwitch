# Single-origin front door: serve the dashboard SPA and reverse-proxy the
# VoidSwitch API to the backend container on the same hostname. Sits behind
# Cloudflare Tunnel (cloudflared → this nginx over http; real scheme arrives in
# X-Forwarded-Proto).

# Honour the proxy's forwarded scheme when present, else fall back to our own.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

upstream voidswitch_backend {
    server voidswitch:8080;
}

server {
    listen 80;
    server_name _;

    # Allow large request bodies (chat payloads) and don't let nginx buffer SSE.
    client_max_body_size 25m;

    # API surface — everything the gateway owns. Anything not matched here is
    # served as the SPA below.
    location ~ ^/(v1|api|healthz|install|install\.sh|install\.ps1|opencode|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://voidswitch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Streaming (SSE) for /v1/chat/completions and /v1/messages: no buffering,
        # generous timeouts so long generations aren't cut off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static SPA with client-side routing fallback (BrowserRouter).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache the HTML entry.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
