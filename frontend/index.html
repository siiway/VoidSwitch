<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidSwitch</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' font-family='sans-serif'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong
      // scheme. Mirrors ThemeContext: an explicit "light"/"dark" wins, otherwise
      // "system" follows the OS. Storage access is wrapped because some browsers
      // block it (privacy mode), in which case we just follow the OS.
      (function () {
        try {
          var saved = null;
          try {
            saved = localStorage.getItem("voidswitch.theme");
          } catch (e) {}
          var scheme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var root = document.documentElement;
          root.setAttribute("data-theme", scheme);
          root.style.colorScheme = scheme;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
