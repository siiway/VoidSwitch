name: Agent release

on:
  workflow_dispatch: {}
  push:
    tags: ["agent-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum
      - id: version
        run: echo "value=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
      - name: Cross-compile
        working-directory: agent
        run: |
          set -e
          cd cmd/voidswitch-agent
          for target in "linux/amd64" "linux/arm64" "darwin/arm64" "darwin/amd64" "windows/amd64"; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" \
                -o "../../dist/voidswitch-agent-$os-$arch$ext" .
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voidswitch-agent-binaries
          path: agent/dist/*

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          tags: ghcr.io/siiway/voidswitch-agent:${{ needs.build.outputs.version }},ghcr.io/siiway/voidswitch-agent:latest

  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voidswitch-agent-binaries
          path: binaries
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: binaries/*
