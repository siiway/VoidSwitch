name: Publish images

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Three kinds of runs:
    #   * tag push (refs/tags/v*)            → release build, image tag = version
    #   * manual dispatch on main            → snapshot build, image tag = commit sha
    #   * branch push                        → snapshot build, but only when the
    #     head commit message contains "<docker-build>" (on-demand dev images
    #     without cutting a release)
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '<docker-build>')
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Release builds (tag pushes) tag the image with the version; snapshot
      # builds (manual dispatch / <docker-build> commits) tag it with the short
      # commit sha. Both always move :latest.
      - name: Derive image tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/siiway/voidswitch:latest
            ghcr.io/siiway/voidswitch:${{ steps.version.outputs.value }}
          # Blank = direct. Kept as predefined Docker args so builds behind a
          # proxy/registry mirror work; never baked into the image.
          build-args: |
            HTTP_PROXY=${{ secrets.HTTP_PROXY }}
            HTTPS_PROXY=${{ secrets.HTTPS_PROXY }}
            NO_PROXY=${{ secrets.NO_PROXY }}
            UV_INDEX_URL=${{ secrets.UV_INDEX_URL }}

      - name: Build & push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/siiway/voidswitch-dashboard:latest
            ghcr.io/siiway/voidswitch-dashboard:${{ steps.version.outputs.value }}
          build-args: |
            HTTP_PROXY=${{ secrets.HTTP_PROXY }}
            HTTPS_PROXY=${{ secrets.HTTPS_PROXY }}
            NO_PROXY=${{ secrets.NO_PROXY }}

  release:
    # Only a version-tag push produces a GitHub release — never a snapshot build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
